<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmAI — Analysis Results</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --primary: #0D9488;
  --primary-dark: #065F55;
  --primary-light: #14B8A6;
  --success: #059669;
  --danger: #DC2626;
  --warning: #D97706;
  --bg-light: #F0FDFA;
  --card-bg: rgba(255,255,255,0.9);
  --card-shadow: 0 4px 6px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.08);
  --text: #1e293b;
  --text-light: #64748b;
  --radius-card: 16px;
  --radius-pill: 40px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-light); color: var(--text); min-height: 100vh;
}
.header-bar {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white; padding: 1.5rem 2rem;
  display: flex; align-items: center; gap: 1rem;
}
.back-btn {
  background: rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.3);
  color: white; padding: 0.5rem 1rem; border-radius: var(--radius-pill);
  cursor: pointer; font-weight:600; font-size:0.85rem;
  text-decoration: none; transition: all 0.3s;
}
.back-btn:hover { background: rgba(255,255,255,0.3); }
.header-title { font-size: 1.4rem; font-weight: 700; }
.header-badge {
  background: rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25);
  border-radius: var(--radius-pill); padding: 0.3rem 0.8rem;
  font-size: 0.75rem; font-weight: 600; margin-left: auto;
}
.main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.query-card {
  background: white; border-radius: var(--radius-card);
  padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
  box-shadow: var(--card-shadow); border: 1px solid rgba(0,0,0,0.06);
  display: flex; align-items: center; gap: 0.75rem;
}
.query-card .label {
  font-size: 0.75rem; text-transform: uppercase; font-weight: 700;
  color: var(--primary); letter-spacing: 0.5px;
}
.query-card .text { font-size: 1.05rem; font-weight: 600; color: var(--text); }
.badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.3rem 0.8rem; border-radius: var(--radius-pill);
  font-size: 0.75rem; font-weight: 700;
}
.badge-allowed { background:#ecfdf5; color:var(--success); border:1px solid #a7f3d0; }
.badge-banned { background:#fef2f2; color:var(--danger); border:1px solid #fecaca; }
.badge-ai { background:#f0fdfa; color:var(--primary); border:1px solid #99f6e4; }
.result-card {
  background: white; border-radius: var(--radius-card); padding: 2rem;
  box-shadow: var(--card-shadow); border: 1px solid rgba(0,0,0,0.06);
  position: relative;
}
.result-card .source-badge { position: absolute; top:1rem; right:1rem; }
.md-content { line-height:1.8; color:var(--text); }
.md-content h1,.md-content h2,.md-content h3 { color:var(--primary-dark); margin:1rem 0 0.5rem; }
.md-content strong { color:var(--primary-dark); }
.md-content ul,.md-content ol { padding-left:1.5rem; margin:0.5rem 0; }
.md-content p { margin:0.5rem 0; }
.md-content code { background:#f1f5f9; padding:0.1rem 0.4rem; border-radius:4px; font-size:0.9em; }
.result-actions {
  display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1.5rem;
  padding-top:1rem; border-top:1px solid #e2e8f0;
}
.action-btn {
  display:inline-flex; align-items:center; gap:0.3rem;
  padding:0.5rem 1rem; border-radius:var(--radius-pill);
  border:1px solid #e2e8f0; background:#f8fafc;
  color:var(--text); font-size:0.8rem; font-weight:600;
  cursor:pointer; transition:all 0.2s;
}
.action-btn:hover { background:var(--primary); color:white; border-color:var(--primary); }
.action-btn:disabled { opacity:0.5; cursor:not-allowed; }
.disclaimer {
  background:#fffbeb; border:1px solid #fde68a; border-radius:12px;
  padding:1rem; margin-top:1.5rem; font-size:0.8rem; color:#92400e;
  display:flex; align-items:flex-start; gap:0.5rem;
}
.loading-container {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; min-height:300px; gap:1.5rem;
}
.loading-spinner {
  width:48px; height:48px; border:4px solid #e2e8f0;
  border-top-color:var(--primary); border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { color:var(--text-light); font-weight:500; }
.loading-fact {
  background:#f0fdfa; border:1px solid #99f6e4; border-radius:12px;
  padding:1rem; max-width:400px; text-align:center;
  font-size:0.85rem; color:var(--text-light); font-style:italic;
}
.error-card {
  background:#fef2f2; border:1px solid #fecaca; border-radius:var(--radius-card);
  padding:2rem; text-align:center; color:#991b1b;
}
.audio-player {
  margin-top:0.75rem; display:none; align-items:center; gap:0.5rem;
  background:#f0fdfa; padding:0.5rem 1rem; border-radius:var(--radius-pill);
}
.audio-player.active { display:flex; }
@media (max-width:768px) {
  .main { padding:1rem; }
  .result-card { padding:1.25rem; }
  .header-bar { padding:1rem; flex-wrap:wrap; }
}
</style>
</head>
<body>

<div class="header-bar">
  <a href="/pharmai" class="back-btn">← Back</a>
  <span class="header-title">Analysis Results</span>
  <span class="header-badge">⚕ PharmAI</span>
</div>

<div class="main">
  <div class="query-card">
    <span style="font-size:1.3rem;">🔍</span>
    <div>
      <div class="label">Analyzed Query</div>
      <div id="queryText" class="text">Loading...</div>
    </div>
  </div>

  <div class="result-card">
    <div id="sourceBadge" class="source-badge"></div>
    <div id="loadingContainer" class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Analyzing medicine databases...</div>
      <div id="factText" class="loading-fact">Loading...</div>
    </div>
    <div id="actualResult" style="display:none;">
      <div id="resultContent" class="md-content"></div>
      <div class="result-actions">
        <button class="action-btn" id="ttsBtn" onclick="readAloud()">🔊 Read Aloud</button>
        <select id="translateLang" class="action-btn" style="border:1px solid #e2e8f0;padding:0.4rem 0.6rem;font-size:0.8rem;cursor:pointer;" onchange="translateResult()">
          <option value="">🌐 Translate to...</option>
          <option value="hi-IN">Hindi / हिंदी</option>
          <option value="ta-IN">Tamil / தமிழ்</option>
          <option value="te-IN">Telugu / తెలుగు</option>
          <option value="bn-IN">Bengali / বাংলা</option>
          <option value="mr-IN">Marathi / मराठी</option>
          <option value="gu-IN">Gujarati / ગુજરાતી</option>
          <option value="kn-IN">Kannada / ಕನ್ನಡ</option>
          <option value="ml-IN">Malayalam / മലയാളം</option>
          <option value="pa-IN">Punjabi / ਪੰਜਾਬੀ</option>
          <option value="od-IN">Odia / ଓଡ଼ିଆ</option>
        </select>
        <button class="action-btn" onclick="copyResult()">📋 Copy</button>
        <button class="action-btn" onclick="window.location.href='/pharmai'">🔍 New Search</button>
      </div>
      <div id="audioPlayer" class="audio-player">
        <audio id="ttsAudio" controls style="height:32px;"></audio>
      </div>
      <div class="disclaimer">
        ⚠️ <span>AI-powered analysis for informational purposes only. Not a substitute for professional medical advice.</span>
      </div>
    </div>
    <div id="errorState" style="display:none;" class="error-card">
      <h3 style="margin-bottom:0.5rem;">❌ Analysis Failed</h3>
      <p id="errorMsg">Unable to complete the analysis.</p>
      <button class="action-btn" style="margin-top:1rem;" onclick="window.location.href='/pharmai'">🔍 Try Again</button>
    </div>
  </div>
</div>

<script>
let currentAnswer = '';
const selectedLang = localStorage.getItem('pharmai_lang') || 'hi-IN';

function apiUrl(path) {
  const base = window.location.pathname.replace(/\/analyze.*$/, '').replace(/\/+$/, '');
  return base + path;
}
function renderMd(text) {
  if (typeof marked !== 'undefined') return marked.parse(text || '');
  return (text || '').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}

const facts = [
  "CDSCO is India's national regulatory body for pharmaceuticals.",
  "Over 2,800 drug formulations are on India's banned/restricted list.",
  "Drug interactions cause over 125,000 deaths annually in the US alone.",
  "AI-powered drug analysis reduces detection time from months to minutes.",
  "India's pharma industry is the 3rd largest by volume globally.",
];
let factIdx = 0;
function rotateFacts() {
  const el = document.getElementById('factText');
  if (el) { el.textContent = '💡 ' + facts[factIdx]; factIdx = (factIdx+1) % facts.length; }
}

document.addEventListener('DOMContentLoaded', () => {
  rotateFacts(); setInterval(rotateFacts, 3000);
  const params = new URLSearchParams(window.location.search);
  let query = params.get('query') || sessionStorage.getItem('currentQuery') || '';
  document.getElementById('queryText').textContent = query || 'No query specified';

  const cached = sessionStorage.getItem('searchResults');
  if (cached) {
    try {
      const data = JSON.parse(cached);
      if (data.answer || data.api_response || data.response) { showResult(data); return; }
    } catch(e) {}
  }
  if (query) fetchSearch(query);
  else showError('No query provided.');
});

async function fetchSearch(query) {
  try {
    const res = await fetch(apiUrl('/api/search'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ query, sessionId: 'pharmai-result-' + Date.now() }),
      signal: AbortSignal.timeout(50000),
    });
    const data = await res.json();
    data.answer ? showResult(data) : showError(data.error || 'No results found.');
  } catch(e) { showError('Network error: ' + e.message); }
}

function showResult(data) {
  document.getElementById('loadingContainer').style.display = 'none';
  document.getElementById('actualResult').style.display = 'block';
  let answer = '';
  if (data.answer) answer = data.answer;
  else if (data.api_response) {
    if (typeof data.api_response === 'string') answer = data.api_response;
    else if (data.api_response.text) answer = data.api_response.text;
    else answer = JSON.stringify(data.api_response, null, 2);
  } else if (data.response) {
    answer = typeof data.response === 'string' ? data.response : JSON.stringify(data.response, null, 2);
  }
  currentAnswer = answer;
  const badge = document.getElementById('sourceBadge');
  if (data.source === 'sarvam') badge.innerHTML = '<span class="badge badge-ai">🤖 Sarvam AI</span>';
  else if (data.source === 'n8n') badge.innerHTML = '<span class="badge badge-allowed">📚 RAG Database</span>';
  document.getElementById('resultContent').innerHTML = renderMd(answer);
}

function showError(msg) {
  document.getElementById('loadingContainer').style.display = 'none';
  document.getElementById('errorState').style.display = 'block';
  document.getElementById('errorMsg').textContent = msg;
}

async function readAloud() {
  if (!currentAnswer) return;
  const btn = document.getElementById('ttsBtn');
  btn.disabled = true; btn.textContent = '🔊 Loading...';
  const plain = currentAnswer.replace(/[#*_`\[\]()]/g,'').replace(/\n+/g,' ').slice(0,500);
  try {
    const res = await fetch(apiUrl('/api/tts'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: plain, language: selectedLang }),
    });
    const d = await res.json();
    if (d.audio) {
      const a = document.getElementById('ttsAudio');
      a.src = 'data:audio/wav;base64,' + d.audio;
      document.getElementById('audioPlayer').classList.add('active');
      a.play();
    }
  } catch(e) {}
  btn.disabled = false; btn.textContent = '🔊 Read Aloud';
}

async function translateResult() {
  const lang = document.getElementById('translateLang').value;
  if (!lang || !currentAnswer) return;
  const plain = currentAnswer.replace(/[#*_`\[\]()]/g,'').replace(/\n+/g,'\n');
  try {
    const res = await fetch(apiUrl('/api/translate'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: plain, target: lang, source: 'en-IN' }),
    });
    const d = await res.json();
    if (d.translated_text) {
      document.getElementById('resultContent').innerHTML =
        '<div class="badge badge-ai" style="margin-bottom:1rem;">🌐 Translated</div>' +
        '<div style="line-height:1.8;">' + d.translated_text.replace(/\n/g,'<br>') + '</div>';
    }
  } catch(e) {}
}

function copyResult() {
  if (currentAnswer) navigator.clipboard.writeText(currentAnswer);
}
</script>
</body>
</html>
